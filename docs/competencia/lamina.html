<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comparativa</title>
<style>
body{margin:0;padding:32px;background:#2F5233;font-family:Figtree,system-ui,sans-serif;color:#F6F1E6}
h1{font-family:Georgia,serif;margin:0 0 4px;font-size:30px} p{margin:0 0 24px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
figure{margin:0;background:#F6F1E6;border-radius:12px;overflow:hidden;color:#23301F}
figure img{display:block;width:100%;height:330px;object-fit:cover;object-position:top}
figcaption{padding:10px 14px;font-size:15px} figcaption b{display:block;font-size:17px}
.us{outline:4px solid #E3A82B}
</style></head><body>
<h1>FOOD4ALL frente a la competencia</h1><p>Parte superior de cada portada · capturas del 8 de octubre de 2026 a 1366 px</p>
<div class="grid">
<figure><img src="food4all-antes.png"><figcaption><b>FOOD4ALL · antes</b>Crema y verde, iconos finos</figcaption></figure>
<figure class="us"><img src="food4all-despues.png"><figcaption><b>FOOD4ALL · después</b>Paleta de mercado, bandas y manchas de color</figcaption></figure>
<figure><img src="wetaca.png"><figcaption><b>Wetaca</b>Rojo, mostaza y oliva; foto de plato</figcaption></figure>
<figure><img src="knoweats.png"><figcaption><b>Knoweats</b>Verde azulado, fotos y fichas de plato</figcaption></figure>
<figure><img src="marketwagon.png"><figcaption><b>Market Wagon</b>Verde con dibujos de línea</figcaption></figure>
<figure><img src="openfood.png"><figcaption><b>Open Food Network</b>Coral con siluetas de comida</figcaption></figure>
<figure><img src="localfood.png"><figcaption><b>Local Food Marketplace</b>Crema, lima y azul petróleo</figcaption></figure>
<figure><img src="glovo.png"><figcaption><b>Glovo</b>Amarillo intenso y verde</figcaption></figure>
<figure><img src="tgtg.png"><figcaption><b>Too Good To Go</b>Verde azulado oscuro, foto</figcaption></figure>
</div></body></html>
