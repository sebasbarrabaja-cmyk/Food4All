<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <title>Campo andaluz con olivos y una caja de fruta y verdura en primer plano</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3DFB8"/>
      <stop offset="1" stop-color="#F6F1E6"/>
    </linearGradient>
    <pattern id="furrows" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="40" height="40" fill="#5C8A4A"/>
      <rect width="40" height="14" fill="#4F7A3F"/>
    </pattern>
    <pattern id="soil" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
      <rect width="36" height="36" fill="#A7764F"/>
      <rect width="36" height="12" fill="#8A5A3B"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1220" cy="210" r="90" fill="#E9A54A" opacity=".85"/>

  <!-- Sierra al fondo -->
  <path d="M0 420 L180 330 L330 380 L500 290 L700 370 L880 300 L1060 360 L1250 280 L1430 350 L1600 310 L1600 520 L0 520Z" fill="#9DB08A" opacity=".7"/>
  <!-- Colinas -->
  <path d="M0 470 C260 400 520 430 780 460 C1040 490 1300 420 1600 440 L1600 620 L0 620Z" fill="#7FA064"/>
  <path d="M0 540 C300 480 600 520 900 545 C1150 565 1400 520 1600 530 L1600 900 L0 900Z" fill="url(#furrows)"/>
  <path d="M0 660 C360 610 700 650 1000 690 C1250 720 1450 700 1600 690 L1600 900 L0 900Z" fill="url(#soil)"/>

  <!-- Olivos -->
  <g fill="#3E6338">
    <g transform="translate(260 470)"><rect x="-6" y="0" width="12" height="40" fill="#6B4A31"/><ellipse cx="0" cy="-8" rx="46" ry="30"/></g>
    <g transform="translate(470 488)"><rect x="-5" y="0" width="10" height="34" fill="#6B4A31"/><ellipse cx="0" cy="-6" rx="38" ry="25"/></g>
    <g transform="translate(690 500)"><rect x="-6" y="0" width="12" height="38" fill="#6B4A31"/><ellipse cx="0" cy="-8" rx="44" ry="28"/></g>
    <g transform="translate(930 515)"><rect x="-5" y="0" width="10" height="32" fill="#6B4A31"/><ellipse cx="0" cy="-6" rx="36" ry="24"/></g>
    <g transform="translate(1500 500)"><rect x="-6" y="0" width="12" height="38" fill="#6B4A31"/><ellipse cx="0" cy="-8" rx="44" ry="28"/></g>
  </g>

  <!-- Cortijo -->
  <g transform="translate(1110 440)">
    <rect x="0" y="20" width="130" height="64" fill="#F6F1E6"/>
    <path d="M-10 24 L65 -8 L140 24Z" fill="#B5643A"/>
    <rect x="52" y="48" width="24" height="36" fill="#8A5A3B"/>
    <rect x="16" y="40" width="18" height="16" fill="#5E6652"/>
    <rect x="96" y="40" width="18" height="16" fill="#5E6652"/>
  </g>

  <!-- Caja de mercado en primer plano -->
  <g transform="translate(1040 640)">
    <!-- Producto -->
    <circle cx="70" cy="40" r="44" fill="#D9822B"/>
    <circle cx="150" cy="30" r="46" fill="#C0392B"/>
    <circle cx="235" cy="42" r="42" fill="#E3B23C"/>
    <circle cx="315" cy="34" r="44" fill="#D9822B"/>
    <circle cx="395" cy="44" r="40" fill="#C0392B"/>
    <ellipse cx="110" cy="10" rx="34" ry="14" fill="#5C8A4A" transform="rotate(-20 110 10)"/>
    <ellipse cx="275" cy="0" rx="40" ry="16" fill="#2F5233" transform="rotate(15 275 0)"/>
    <ellipse cx="455" cy="20" rx="28" ry="56" fill="#5C8A4A" transform="rotate(35 455 20)"/>
    <rect x="22" y="-40" width="10" height="70" rx="4" fill="#2F5233" transform="rotate(-25 27 -5)"/>
    <!-- Caja de madera -->
    <rect x="0" y="60" width="500" height="200" fill="#A7764F"/>
    <rect x="0" y="60" width="500" height="18" fill="#8A5A3B"/>
    <rect x="0" y="130" width="500" height="10" fill="#8A5A3B"/>
    <rect x="0" y="200" width="500" height="10" fill="#8A5A3B"/>
    <rect x="0" y="60" width="16" height="200" fill="#6B4A31"/>
    <rect x="484" y="60" width="16" height="200" fill="#6B4A31"/>
    <rect x="200" y="94" width="100" height="26" rx="3" fill="#F6F1E6" opacity=".9"/>
  </g>
</svg>
